name: Linting Pipeline

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - name: Use Node.js
      uses: actions/setup-node@v2
      with:
        node-version: '14'
    - run: npm install -g htmlhint stylelint stylelint-config-standard
    - name: Lint HTML
      run: htmlhint "**/*.html"
    - name: Lint CSS
      run: stylelint "**/*.css"
